<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El tiempo en Espadaña — Estación Meteorológica</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-cloud-sun"></i>
                </div>
                <div class="brand-text">
                    <h1>El tiempo en Espadaña</h1>
                    <span class="brand-sub">Estación Sainlogic Espadaña</span>
                </div>
            </div>

            <div class="header-right">
                <nav class="desktop-nav">
                    <a href="/" class="nav-tab active">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="/analisis" class="nav-tab">
                        <i class="fa-solid fa-download"></i>
                        <span>Análisis</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content container">
        <div class="dashboard-header">
            <div class="last-update-wrapper">
                <span class="pulse-indicator">
                    <span class="dot"></span>
                </span>
                <span>Última actualización: <strong id="last-update">--</strong></span>
            </div>
        </div>

        <div class="weather-grid">
            <!-- Temperatura -->
            <div class="weather-card primary-card">
                <div class="card-header">
                    <span class="card-label">Temperatura</span>
                    <div class="card-icon" id="temp-icon">
                        <i class="fa-solid fa-temperature-three-quarters"></i>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-value" id="temperatura">--</div>
                </div>
            </div>

            <!-- Humedad -->
            <div class="weather-card">
                <div class="card-header">
                    <span class="card-label">Humedad Relativa</span>
                    <div class="card-icon">
                        <i class="fa-solid fa-droplet"></i>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-value" id="humedad">--</div>
                </div>
            </div>

            <!-- Precipitación 24h -->
            <div class="weather-card">
                <div class="card-header">
                    <span class="card-label">Precipitación (24h)</span>
                    <div class="card-icon">
                        <i class="fa-solid fa-cloud-showers-heavy"></i>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-value" id="rain_24h">--</div>
                </div>
            </div>

            <!-- Viento Medio -->
            <div class="weather-card">
                <div class="card-header">
                    <span class="card-label">Viento Medio</span>
                    <div class="card-icon">
                        <i class="fa-solid fa-wind"></i>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-value" id="viento_medio">--</div>
                </div>
            </div>

            <!-- Ráfaga Máxima -->
            <div class="weather-card">
                <div class="card-header">
                    <span class="card-label">Ráfaga Máxima</span>
                    <div class="card-icon">
                        <i class="fa-solid fa-gauge-high"></i>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-value" id="rafaga">--</div>
                </div>
            </div>

            <!-- Dirección del Viento -->
            <div class="weather-card wind-direction-card">
                <div class="card-header">
                    <span class="card-label">Dirección del Viento</span>
                </div>
                <div class="card-body wind-body">
                    <div class="compass-container">
                        <i class="fa-solid fa-location-arrow wind-arrow" id="wind-arrow"></i>
                    </div>
                    <div class="card-value" id="direccion_text">--</div>
                </div>
            </div>
        </div>

        <!-- Estado del Sistema -->
        <div class="system-status-card">
            <div class="status-item">
                <i class="fa-solid fa-wifi"></i>
                <span>Señal WiFi:</span>
                <strong id="wifi-signal">--</strong> dBm
            </div>
            <div class="status-divider"></div>
            <div class="status-item">
                <i class="fa-solid fa-clock"></i>
                <span>Tiempo Encendido:</span>
                <strong id="uptime">--</strong>
            </div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
